# healthy_regimes_test.yaml -- Short test version (5 minutes total)
# Used to verify the characterization pipeline works before running full 60-min baseline.

regime_scheduler:
  ros__parameters:

    target_node:    '/input'
    param_frequency: 'frequency'
    param_f_min:     'f_min'
    param_f_max:     'f_max'
    settle_time:     0.5
    manifest_path:   'baseline_manifest.json'

    sequence_json: |
      [
        {
          "name": "TEST_slow",
          "kind": "static",
          "duration": 60.0,
          "params": {"frequency": 0.05, "f_min": -12.0, "f_max": 0.0}
        },
        {
          "name": "TEST_nominal",
          "kind": "static", 
          "duration": 60.0,
          "params": {"frequency": 0.10, "f_min": -10.0, "f_max": 0.0}
        },
        {
          "name": "TEST_fast",
          "kind": "static",
          "duration": 60.0,
          "params": {"frequency": 0.20, "f_min": -6.0, "f_max": 0.0}
        }
      ]
